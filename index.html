<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>兔子接蘑菇遊戲 - 雲端排行榜版</title>
<style>
    body { margin: 0; padding: 0; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    #gameContainer { position: relative; width: 100%; max-width: 800px; height: 100%; max-height: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); background-color: #a8e6cf; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; object-fit: cover; touch-action: none; }
    #ui { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; font-size: clamp(16px, 4vw, 28px); font-weight: bold; color: #2c3e50; pointer-events: none; text-shadow: 2px 2px 4px rgba(255,255,255,0.7); z-index: 2; }
    #powerUpMsg { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: clamp(18px, 5vw, 24px); font-weight: bold; color: #ffeb3b; text-shadow: 0 0 10px #ff9800, 2px 2px 4px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2; }
    #controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 40px; z-index: 5; pointer-events: none; }
    .control-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); background: rgba(0, 0, 0, 0.3); color: white; font-size: 30px; display: flex; justify-content: center; align-items: center; pointer-events: auto; cursor: pointer; user-select: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.1s; }
    .control-btn:active { background: rgba(0, 0, 0, 0.6); transform: scale(0.95); }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; z-index: 10; }
    #overlay h1 { font-size: clamp(30px, 7vw, 50px); margin-bottom: 5px; color: #ffeb3b; }
    #finalScore { font-size: clamp(20px, 5vw, 32px); margin-bottom: 10px; }
    #playerName { font-size: clamp(16px, 4vw, 22px); padding: 10px; text-align: center; border-radius: 8px; border: 2px solid #fff; outline: none; text-transform: uppercase; width: 80%; max-width: 250px; margin-bottom: 15px; font-weight: bold; background: rgba(255,255,255,0.9); }
    #playerName::placeholder { color: #888; text-transform: none; font-weight: normal; }
    #difficultyUI { margin-bottom: 15px; font-size: clamp(14px, 3.5vw, 18px); background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; }
    #difficultyUI label { margin: 0 5px; cursor: pointer; display: inline-block; padding: 5px; }
    #leaderboard { background: rgba(255,255,255,0.15); padding: 10px 20px; border-radius: 10px; margin-bottom: 15px; text-align: left; min-width: 280px; }
    #leaderboard h3 { margin: 0 0 10px 0; color: #ffeb3b; text-align: center; font-size: clamp(16px, 4vw, 22px);}
    #leaderboard ol { margin: 0; padding-left: 20px; font-size: clamp(14px, 4vw, 18px); }
    .diff-badge { font-size: 12px; background: #ff5722; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    .name-badge { font-weight: bold; color: #a8e6cf; margin-right: 10px; }
    button.start { padding: 12px 30px; font-size: clamp(18px, 5vw, 24px); cursor: pointer; border: none; border-radius: 50px; background-color: #ff8b94; color: white; font-weight: bold; box-shadow: 0 5px 15px rgba(255,139,148,0.4); transition: 0.2s; }
    button.start:hover { background-color: #ff7480; transform: scale(1.05); }
    .hidden { display: none !important; }
    .new-record-effect { animation: flashBg 0.5s infinite alternate; }
    @keyframes flashBg { 0% { background: rgba(0,0,0,0.8); } 100% { background: rgba(255, 215, 0, 0.4); } }
    #newRecordMsg { color: #ff5722; font-size: clamp(24px, 6vw, 40px); font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px white; display: none; animation: scaleUp 0.5s infinite alternate; }
    @keyframes scaleUp { from { transform: scale(1); } to { transform: scale(1.1); } }
</style>
</head>
<body>

<div id="gameContainer">
    <div id="ui"><div id="timeDisplay">時間: 20</div><div id="scoreDisplay">分數: 0</div></div>
    <div id="powerUpMsg">⭐⭐ 無敵狀態 ⭐⭐</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="controls"><div class="control-btn" id="btnLeft">◀</div><div class="control-btn" id="btnRight">▶</div></div>
    
    <div id="overlay">
        <h1 id="gameOverTitle">🍄 兔子接蘑菇 🐇</h1>
        <div id="newRecordMsg">🎉 上榜啦！ 🎉</div>
        <div id="finalScore" class="hidden">總分：0 分</div>
        
        <input type="text" id="playerName" maxlength="10" placeholder="入名 (最多10個英文字)" autocomplete="off">
        
        <div id="leaderboard">
            <h3>☁️ 雲端排行榜 (Top 5)</h3>
            <ol id="scoreList"><li>連線中...</li></ol>
        </div>

        <div id="difficultyUI">
            <label><input type="radio" name="diff" value="easy"> 呆呆</label>
            <label><input type="radio" name="diff" value="normal" checked> 乖乖</label>
            <label><input type="radio" name="diff" value="hard"> 醒目</label>
            <label><input type="radio" name="diff" value="very_hard"> 高高</label>
        </div>

        <button class="start" id="startBtn">開始</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 🔴 請將呢段換返做你自己嘅 Firebase Config 🔴
    const firebaseConfig = {
      apiKey: "AIzaSyBRLSRptfE8FBQc3MDPiFsaP2v_LFFobpg",
      authDomain: "rabbitgamecloud.firebaseapp.com",
      projectId: "rabbitgamecloud",
      storageBucket: "rabbitgamecloud.firebasestorage.app",
      messagingSenderId: "1080876873139",
      appId: "1:1080876873139:web:c58123c6011818ff9cc7c6"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay'); const scoreDisplay = document.getElementById('scoreDisplay');
    const powerUpMsg = document.getElementById('powerUpMsg'); const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn'); const gameOverTitle = document.getElementById('gameOverTitle');
    const finalScore = document.getElementById('finalScore'); const scoreList = document.getElementById('scoreList');
    const difficultyRadios = document.getElementsByName('diff'); const newRecordMsg = document.getElementById('newRecordMsg');
    const playerNameInput = document.getElementById('playerName');

    playerNameInput.addEventListener('input', function() { this.value = this.value.replace(/[^A-Za-z]/g, '').toUpperCase(); });

    let isPlaying = false, score = 0, timeLeft = 20;
    let animationId, timerId, speedMultiplier = 1, currentDiff = 'normal';
    let isInvincible = false, invincibleTimer = null; let currentPlayerName = "ANONYMOUS";
    const diffNames = { 'easy': '呆呆', 'normal': '乖乖', 'hard': '醒目', 'very_hard': '高高' };
    const keys = { ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) { keys[e.code] = true; e.preventDefault(); } });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });
    const btnLeft = document.getElementById('btnLeft'); const btnRight = document.getElementById('btnRight');
    const pressLeft = (e) => { e.preventDefault(); keys.ArrowLeft = true; }; const releaseLeft = (e) => { e.preventDefault(); keys.ArrowLeft = false; };
    const pressRight = (e) => { e.preventDefault(); keys.ArrowRight = true; }; const releaseRight = (e) => { e.preventDefault(); keys.ArrowRight = false; };
    btnLeft.addEventListener('touchstart', pressLeft, {passive: false}); btnLeft.addEventListener('touchend', releaseLeft); btnLeft.addEventListener('mousedown', pressLeft); btnLeft.addEventListener('mouseup', releaseLeft); btnLeft.addEventListener('mouseleave', releaseLeft);
    btnRight.addEventListener('touchstart', pressRight, {passive: false}); btnRight.addEventListener('touchend', releaseRight); btnRight.addEventListener('mousedown', pressRight); btnRight.addEventListener('mouseup', releaseRight); btnRight.addEventListener('mouseleave', releaseRight);

    const player = { emoji: '🐇', size: 70, x: 400, y: 530, speed: 10 };
    let fallingObjects = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext; let audioCtx;
    function playCoinSound() { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    function playPowerUpSound() { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.1); osc.frequency.linearRampToValueAtTime(1760, audioCtx.currentTime + 0.2); gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }

    async function renderLeaderboard() {
        try {
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(5));
            const querySnapshot = await getDocs(q);
            scoreList.innerHTML = '';
            if (querySnapshot.empty) { scoreList.innerHTML = '<li>暫無紀錄，快啲做第一！</li>'; return; }
            querySnapshot.forEach((doc) => {
                const s = doc.data();
                const li = document.createElement('li');
                li.innerHTML = `<span class="name-badge">${s.name}</span>${s.score} 分 <span class="diff-badge">${s.difficulty}</span>`;
                scoreList.appendChild(li);
            });
        } catch (error) {
            console.error("Error reading leaderboard:", error);
            scoreList.innerHTML = '<li>讀取失敗，請檢查網絡連線</li>';
        }
    }
    
    renderLeaderboard();

    async function saveScoreToCloud(newScore, diffName, pName) {
        if (newScore <= 0) return false; 
        try {
            await addDoc(collection(db, "leaderboard"), { name: pName, score: newScore, difficulty: diffName, timestamp: new Date() });
            return true;
        } catch (error) { console.error("Error saving score:", error); return false; }
    }

    const itemTypes = [
        { emoji: '🍄', type: 'large', size: 70, points: 10, baseSpeed: 6, prob: 0.105 },
        { emoji: '🍄', type: 'medium', size: 50, points: 5, baseSpeed: 4.5, prob: 0.395 },
        { emoji: '🍄', type: 'small', size: 30, points: 1, baseSpeed: 3, prob: 0.50 }
    ];

    function spawnObject() {
        if (!isPlaying) return;
        
        // 根據難度決定道具出現機率
        let powerUpChance = 0.01; 
        if (currentDiff === 'easy') powerUpChance = 0.005; // 0.5%
        else if (currentDiff === 'normal') powerUpChance = 0.01; // 1%
        else if (currentDiff === 'hard') powerUpChance = 0.015; // 1.5%
        else if (currentDiff === 'very_hard') powerUpChance = 0.02; // 2%

        if (Math.random() < powerUpChance) {
            if (currentDiff === 'hard' || currentDiff === 'very_hard') {
                if (Math.random() < 0.5) fallingObjects.push({ emoji: '⭐', type: 'star', x: Math.random() * (canvas.width - 50) + 25, y: -50, size: 50, points: 0, speed: 5 * speedMultiplier });
                else fallingObjects.push({ emoji: '⏰', type: 'clock', x: Math.random() * (canvas.width - 50) + 25, y: -50, size: 50, points: 0, speed: 5 * speedMultiplier });
            } else { fallingObjects.push({ emoji: '⏰', type: 'clock', x: Math.random() * (canvas.width - 50) + 25, y: -50, size: 50, points: 0, speed: 5 * speedMultiplier }); }
            return; 
        }

        let config = null, isCorn = false;
        if (currentDiff === 'very_hard') {
            if (timeLeft <= 8 && Math.random() < 0.2) { config = { emoji: '🌽', type: 'large_corn', size: 70, points: -10, baseSpeed: 5 }; isCorn = true; } 
            else if (timeLeft <= 13 && Math.random() < 0.2) { config = { emoji: '🌽', type: 'medium_corn', size: 50, points: -5, baseSpeed: 4.5 }; isCorn = true; } 
            else if (Math.random() < 0.4) { config = { emoji: '🌽', type: 'small_corn', size: 30, points: -1, baseSpeed: 3 }; isCorn = true; }
        } else if (currentDiff === 'hard') {
            if (timeLeft <= 7 && Math.random() < 0.2) { config = { emoji: '🌽', type: 'medium_corn', size: 50, points: -5, baseSpeed: 4.5 }; isCorn = true; } 
            else if (Math.random() < 0.4) { config = { emoji: '🌽', type: 'small_corn', size: 30, points: -1, baseSpeed: 3 }; isCorn = true; }
        }
        if (!isCorn) {
            const rand = Math.random(); if (rand < itemTypes[0].prob) config = itemTypes[0]; else if (rand < itemTypes[0].prob + itemTypes[1].prob) config = itemTypes[1]; else config = itemTypes[2];
        }
        fallingObjects.push({ emoji: config.emoji, type: config.type, x: config.size / 2 + Math.random() * (canvas.width - config.size), y: -config.size, size: config.size, points: config.points, speed: (config.baseSpeed + Math.random() * 2) * speedMultiplier });
    }

    function activateStar() { playPowerUpSound(); isInvincible = true; powerUpMsg.innerText = "⭐⭐ 無敵狀態 ⭐⭐"; powerUpMsg.style.opacity = "1"; if (invincibleTimer) clearTimeout(invincibleTimer); invincibleTimer = setTimeout(() => { isInvincible = false; powerUpMsg.style.opacity = "0"; }, 5000); }
    
    // 根據難度決定加幾多秒
    function activateClock() { 
        playPowerUpSound(); 
        let addedTime = 2; // 呆呆、乖乖、醒目預設加 2 秒
        if (currentDiff === 'very_hard') addedTime = 1; // 高高免只加 1 秒

        timeLeft += addedTime; 
        timeDisplay.innerText = `時間: ${timeLeft}`; 
        powerUpMsg.innerText = `⏰ 時間 +${addedTime} 秒 ⏰`; 
        powerUpMsg.style.opacity = "1"; 
        setTimeout(() => { if(!isInvincible) powerUpMsg.style.opacity = "0"; }, 1500); 
    }
    
    function drawEmoji(emoji, x, y, size) { ctx.font = `${size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(emoji, x, y); }

    function update() {
        if (!isPlaying) return; ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (keys.ArrowLeft && player.x > player.size / 2) player.x -= player.speed; if (keys.ArrowRight && player.x < canvas.width - player.size / 2) player.x += player.speed;
        if (isInvincible) { ctx.shadowColor = "gold"; ctx.shadowBlur = 30; } else { ctx.shadowBlur = 0; }
        drawEmoji(player.emoji, player.x, player.y, player.size); ctx.shadowBlur = 0; 

        for (let i = fallingObjects.length - 1; i >= 0; i--) {
            let obj = fallingObjects[i]; obj.y += obj.speed;
            if (obj.type === 'star' || obj.type === 'clock') { ctx.shadowColor = "white"; ctx.shadowBlur = 15; }
            drawEmoji(obj.emoji, obj.x, obj.y, obj.size); ctx.shadowBlur = 0;

            const dx = player.x - obj.x; const dy = player.y - obj.y;
            if (Math.sqrt(dx * dx + dy * dy) < (player.size/2 + obj.size/2 - 15)) { 
                if (obj.type === 'star') activateStar(); else if (obj.type === 'clock') activateClock(); else if (obj.type.includes('corn')) { if (!isInvincible) score += obj.points; }  else { score += obj.points; if (obj.type === 'large') playCoinSound(); }
                scoreDisplay.innerText = `分數: ${score}`; fallingObjects.splice(i, 1); continue;
            }
            if (obj.y > canvas.height + obj.size) fallingObjects.splice(i, 1);
        }
        let spawnRate = 0.06; if (currentDiff === 'hard') spawnRate = 0.08; if (currentDiff === 'very_hard') spawnRate = 0.1; if (Math.random() < spawnRate) spawnObject();
        animationId = requestAnimationFrame(update);
    }

    function startGame() {
        currentPlayerName = playerNameInput.value.trim().toUpperCase() || "ANONYMOUS";
        for(let radio of difficultyRadios) { if(radio.checked) currentDiff = radio.value; }
        if (currentDiff === 'easy') speedMultiplier = 0.7; else if (currentDiff === 'normal') speedMultiplier = 1; else if (currentDiff === 'hard') speedMultiplier = 1.2; else if (currentDiff === 'very_hard') speedMultiplier = 1.4;

        score = 0; timeLeft = 20; fallingObjects = []; player.x = canvas.width / 2; isPlaying = true; isInvincible = false; powerUpMsg.style.opacity = "0";
        if(invincibleTimer) clearTimeout(invincibleTimer);
        scoreDisplay.innerText = `分數: ${score}`; timeDisplay.innerText = `時間: ${timeLeft}`;
        overlay.classList.add('hidden'); overlay.classList.remove('new-record-effect'); newRecordMsg.style.display = 'none';

        if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
        update();
        timerId = setInterval(() => { timeLeft--; timeDisplay.innerText = `時間: ${timeLeft}`; if (timeLeft <= 0) endGame(); }, 1000);
    }

    async function endGame() {
        isPlaying = false; cancelAnimationFrame(animationId); clearInterval(timerId);
        
        startBtn.innerText = "上傳分數中..."; startBtn.disabled = true;

        const isSaved = await saveScoreToCloud(score, diffNames[currentDiff], currentPlayerName);
        await renderLeaderboard();

        gameOverTitle.innerText = "CONGRATULATIONS!";
        finalScore.innerText = `總分：${score} 分`;
        finalScore.classList.remove('hidden');
        startBtn.innerText = "再玩一次"; startBtn.disabled = false;
        document.getElementById('difficultyUI').classList.remove('hidden');
        powerUpMsg.style.opacity = "0"; 
        
        if (isSaved && score > 0) { overlay.classList.add('new-record-effect'); newRecordMsg.style.display = 'block'; }
        keys.ArrowLeft = false; keys.ArrowRight = false; overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
